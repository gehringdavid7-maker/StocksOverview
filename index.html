<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Stock Overview</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0D0D0D; font-family:Arial, Helvetica, sans-serif; color:white; padding: 40px 20px; zoom: 0.55; transform-origin: top left; position: relative; min-height: 100vh; overflow-x: hidden; }

        /* Globus: zentriert hinter dem Daily-News-Widget, 1.2x so gross wie vorher (850px -> 1020px) */
        #bg-globe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1020px;
            height: 1020px;
            z-index: -1;
            opacity: 0.55;
            pointer-events: none;
        }

        /* Intro-Titel: doppelt so gross, liegt nach dem Login 1s mittig über dem Globus, dann 0.5s ausblenden */
        #intro-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;           /* 2x von 50px */
            font-weight: 600;
            white-space: nowrap;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
        }

        .header-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; position: relative; z-index: 1; }
        .header { font-size: 50px; font-weight: 600; }
        .clock-container { margin-top: 10px; transform: scale(2); transform-origin: center top; }
        
        .main-container { display: flex; flex-direction: column; align-items: center; gap: 38px; position: relative; z-index: 1; }
        .dashboard { display: grid; grid-template-columns: repeat(5, 456px); gap: 38px; margin-bottom: 38px; }
        
        .widget { background:#3B3A3A; border-radius: 22px; padding: 24px; overflow: hidden; height: 420px; width: 456px; position: relative; }
        .widget-transparent { background: rgba(13, 13, 13, 0.75); backdrop-filter: blur(4px); border-radius: 22px; padding: 24px; overflow: hidden; height: 420px; width: 456px; }
        
        .w-wide { width: 950px; }
        .widget-wrapper { background:#3B3A3A; border-radius: 22px; padding: 24px; overflow: hidden; height: 420px; position: relative; }
        
        .widget-title { text-align:center; font-size: 24px; font-weight:600; margin-bottom:18px; }
        .ticker-item { background: #1A1A1A; border-radius: 10.5px; margin-bottom: 9px; height: 54px; display: flex; align-items: center; overflow: hidden; }
        
        .white-btn-style { background: #FFFFFF !important; color: #000000 !important; font-weight: bold; height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 10.5px; cursor: pointer; text-decoration: none; margin-bottom: 9px; border: none; width: 100%; font-size: 21px; }
        .white-btn-style:hover { background: #e0e0e0 !important; }

        /* ---------- Scrollbare Widgets ---------- */
        .scrollable {
            overflow-y: auto !important;
            overflow-x: hidden !important;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.35) transparent;
        }
        .scrollable::-webkit-scrollbar { width: 8px; }
        .scrollable::-webkit-scrollbar-track { background: transparent; }
        .scrollable::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 4px; }

        /* ---------- BTC-Seasonal-Popup: unsichtbar bereit, wird per Knopf im Fokus-Modus geöffnet ---------- */
        .popup-card:not(.focused) {
            position: fixed;
            top: 0;
            left: -10000px;
            visibility: hidden;
            pointer-events: none;
        }
        .popup-chart { height: calc(100% - 46px); width: 100%; }
        .popup-chart tv-seasonal-chart { display: block; width: 100%; height: 100%; }

        /* ---------- Stocks-Widget: Titel + Glühbirne bleiben stehen, nur die Ticker scrollen ---------- */
        .stocks-widget { display: flex; flex-direction: column; }
        .stocks-widget .scroll-area { flex: 1; min-height: 0; }

        /* ---------- Stocks-Detail (Glühbirne): 4 hohe Widgets (je 1 breit), werden gross eingeblendet ---------- */
        .stocks-panel {
            display: grid;
            grid-template-columns: repeat(4, 456px);
            grid-template-rows: 1fr;
            gap: 38px;
            width: 1938px;     /* 4 x 456 + 3 x 38 */
            height: 1362px;
        }
        .stocks-panel.focused { box-shadow: none; }
        .stock-col { background: #3B3A3A; border-radius: 22px; padding: 24px 22px; overflow: hidden; display: flex; flex-direction: column; }
        .stock-title { font-size: 32px; font-weight: 700; text-align: left; margin-bottom: 18px; }
        .stock-col .sym-box { width: 100%; margin-bottom: 9px; }
        /* Technical Analysis: volle Spaltenbreite (wie der News-Knopf), 464px hoch */
        .stock-col .ta-box { width: 100%; height: 330px; margin-bottom: 9px; flex: none; }
        .stock-col .ta-box tv-technical-analysis { display: block; width: 100%; height: 330px; }
        .stock-col .fin-box { width: 100%; margin-bottom: 9px; position: relative; }
        .fin-zoom { top: 6px; right: 6px; }
        .stock-col .fin-box > * { max-width: 100%; }


        /* ---------- Balance sheet (interaktives Overlay) ---------- */
        .widget.bs-card { width: 1500px; height: 1000px; padding: 22px 28px 18px; display: flex; flex-direction: column; }
        .bs-top { display: flex; align-items: baseline; gap: 16px; padding-right: 74px; flex: none; }
        .bs-title { font-size: 32px; font-weight: 700; letter-spacing: 0.5px; }
        .bs-name { font-size: 18px; color: #b8b8b8; }
        .bs-asof { margin-left: auto; font-size: 14px; color: #a8a8a8; }
        .bs-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; margin-top: 12px; padding-right: 10px; }
        .bs-scroll::-webkit-scrollbar { width: 8px; }
        .bs-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 4px; }
        .bs-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin-bottom: 14px; }
        .bs-seg { display: inline-flex; background: #1A1A1A; border-radius: 12px; padding: 3px; gap: 2px; }
        .bs-seg button { height: 34px; padding: 0 18px; border: none; border-radius: 9px; background: transparent; color: #cfcfcf; font-size: 15px; font-weight: 600; cursor: pointer; }
        .bs-seg button:hover { background: rgba(255, 255, 255, 0.12); }
        .bs-seg button.on { background: #fff; color: #000; }
        .bs-lbl { font-size: 12.5px; color: #a8a8a8; margin-right: 8px; letter-spacing: 0.8px; }
        .bs-kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 14px; }
        .bs-kpi { background: #1A1A1A; border-radius: 14px; padding: 12px 14px 8px; cursor: pointer; border: 1.5px solid transparent; transition: border-color .15s, transform .15s; text-align: left; color: #fff; font-family: inherit; }
        .bs-kpi:hover { border-color: rgba(255, 255, 255, 0.35); transform: translateY(-1px); }
        .bs-kpi.on { border-color: #fff; }
        .bs-kpi .k-l { font-size: 12.5px; color: #a8a8a8; letter-spacing: 0.6px; }
        .bs-kpi .k-v { font-size: 27px; font-weight: 700; margin: 2px 0 0; white-space: nowrap; }
        .bs-kpi .k-v small { font-size: 14px; font-weight: 500; color: #a8a8a8; margin-left: 4px; }
        .bs-kpi .k-d { font-size: 13px; font-weight: 600; height: 18px; }
        .bs-kpi svg { width: 100%; height: 30px; display: block; margin-top: 4px; }
        .up { color: #5ed39a; } .down { color: #ff7b7b; } .flat { color: #a8a8a8; }
        .bs-main { display: grid; grid-template-columns: 1.85fr 1fr; gap: 14px; margin-bottom: 14px; }
        .bs-panel { background: #1A1A1A; border-radius: 16px; padding: 14px 16px; }
        .bs-chips { display: flex; flex-wrap: wrap; gap: 6px 6px; align-items: center; margin-bottom: 8px; }
        .bs-chips .g { font-size: 11.5px; color: #8f8f8f; letter-spacing: 0.8px; margin: 0 2px 0 10px; }
        .bs-chips .g:first-child { margin-left: 0; }
        .bs-chip { height: 30px; padding: 0 12px; border: none; border-radius: 15px; background: rgba(255, 255, 255, 0.10); color: #e6e6e6; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .bs-chip:hover { background: rgba(255, 255, 255, 0.22); }
        .bs-chip.on { background: #fff; color: #000; }
        .bs-ovr { display: flex; align-items: center; gap: 6px; margin: 2px 0 6px; flex-wrap: wrap; }
        .bs-ovr .bs-chip { height: 26px; font-size: 12.5px; }
        .bs-ovr .bs-chip.on { background: #6cc4ff; color: #00121f; }
        .bs-chart { position: relative; }
        .bs-chart svg { width: 100%; height: auto; display: block; user-select: none; }
        .bs-slot .bs-hit { fill: transparent; cursor: pointer; }
        .bs-slot .bs-bar { opacity: 0.62; transition: opacity .12s; }
        .bs-slot:hover .bs-bar, .bs-slot.sel .bs-bar { opacity: 1; }
        .bs-slot.sel .bs-band, .bs-slot:hover .bs-band { opacity: 1; }
        .bs-band { fill: rgba(255, 255, 255, 0.06); opacity: 0; transition: opacity .12s; }
        .bs-bar { transform-box: fill-box; transform-origin: bottom; animation: bsgrow .45s ease-out both; }
        @keyframes bsgrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
        .bs-tip { position: absolute; pointer-events: none; background: rgba(10, 10, 10, 0.96); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 12px; padding: 10px 13px; font-size: 14px; min-width: 190px; z-index: 5; display: none; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
        .bs-tip b { display: block; font-size: 16px; margin-bottom: 4px; }
        .bs-tip div { display: flex; justify-content: space-between; gap: 18px; color: #cfcfcf; line-height: 1.55; }
        .bs-tip div span:last-child { color: #fff; font-weight: 600; }
        .bs-tip em { display: block; font-style: normal; color: #ffd27a; font-size: 12.5px; margin-top: 5px; max-width: 280px; line-height: 1.35; }
        .bs-h { font-size: 13px; font-weight: 700; color: #a8a8a8; letter-spacing: 0.8px; margin-bottom: 8px; }
        .bs-det { width: 100%; border-collapse: collapse; font-size: 14px; }
        .bs-det td { padding: 5px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
        .bs-det td:nth-child(2) { text-align: right; font-weight: 600; }
        .bs-det td:nth-child(3) { text-align: right; width: 92px; font-size: 13px; font-weight: 600; }
        .bs-det td:first-child { color: #cfcfcf; }
        .bs-note { margin-top: 10px; padding: 9px 11px; background: rgba(255, 210, 122, 0.10); border-left: 3px solid #ffd27a; border-radius: 6px; font-size: 13px; line-height: 1.45; color: #f0e2bf; }
        .bs-ins { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 22px; }
        .bs-ins div { font-size: 14px; line-height: 1.5; color: #d6d6d6; }
        .bs-ins b { display: block; font-size: 12px; color: #a8a8a8; letter-spacing: 0.7px; margin-bottom: 1px; }
        .bs-tblwrap { overflow-x: auto; }
        .bs-table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
        .bs-table th, .bs-table td { padding: 7px 11px; text-align: right; border-bottom: 1px solid rgba(255, 255, 255, 0.08); white-space: nowrap; }
        .bs-table th { color: #a8a8a8; font-weight: 600; cursor: pointer; position: sticky; top: 0; background: #1A1A1A; }
        .bs-table th:hover { color: #fff; }
        .bs-table th:first-child, .bs-table td:first-child { text-align: left; color: #e0e0e0; position: sticky; left: 0; background: #1A1A1A; z-index: 1; }
        .bs-table .selc { background: rgba(255, 255, 255, 0.10); }
        .bs-table th.selc { color: #fff; }
        .bs-table td.sep, .bs-table td.grp { background: #141414; color: #8f8f8f; font-size: 11.5px; letter-spacing: 0.8px; padding: 5px 11px; }
        .bs-copy { float: right; height: 28px; padding: 0 14px; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.12); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .bs-copy:hover { background: rgba(255, 255, 255, 0.24); }
        .bs-empty { margin: auto; text-align: center; color: #a8a8a8; font-size: 20px; line-height: 1.6; padding: 80px 0; }
        .bs-src { font-size: 12px; line-height: 1.5; color: #8f8f8f; margin-top: 12px; }

        /* ---------- Fokus-Modus: Lupe oben rechts, Klick = Widget 2x gross in der Mitte, Kreuz = zurück ---------- */
        .zoom-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 51px;               /* 1.5x (vorher 34px) */
            height: 51px;
            padding: 0;
            border: none;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;               /* über den TradingView-iframes */
        }
        .zoom-btn-left { right: auto; left: 14px; }
        .zoom-btn:hover { background: rgba(255, 255, 255, 0.28); }
        .zoom-btn svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
        .zoom-btn .ico-close { display: none; }
        .focused .zoom-btn .ico-search { display: none; }
        .focused .zoom-btn .ico-close { display: block; }

        #focus-backdrop {
            position: fixed;
            inset: 0;
            z-index: 90;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        #focus-backdrop.show { opacity: 1; pointer-events: auto; }

        .focused {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            margin: 0 !important;
            z-index: 100 !important;
            transform: translate(-50%, -50%) scale(var(--focus-scale, 2)) !important;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
        }

        /* ---------- Intro-Animation (startet erst nach dem Login) ---------- */
        @keyframes fadeInAll {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        /* 0-1s sichtbar, dann in 0.5s ausblenden (1.5s total, 0.5/1.5 = 33%) */
        @keyframes introTitle {
            0%, 66.66% { opacity: 1; }
            100%       { opacity: 0; }
        }

        .header-container,
        .widget,
        .widget-transparent,
        .widget-wrapper {
            opacity: 0;
        }

        body.unlocked .header-container,
        body.unlocked .widget,
        body.unlocked .widget-transparent,
        body.unlocked .widget-wrapper {
            animation: fadeInAll 0.5s ease-out 1s forwards; /* Dauer 0.5s, Start nach 1s */
        }

        /* Popups (BTC, Financials) sofort sichtbar, keine Einblend-Verzögerung beim Öffnen */
        body.unlocked .widget.popup-card { animation: none; opacity: 1; }

        body.unlocked #intro-title {
            animation: introTitle 1.5s linear forwards;
        }

        /* ---------- Login-Bildschirm ---------- */
        #login-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(13, 13, 13, 0.55);
            backdrop-filter: blur(3px);
            transition: opacity 0.4s ease;
        }
        #login-overlay.hide { opacity: 0; pointer-events: none; }

        /* body hat zoom 0.55, daher hier wieder hochskalieren (1 / 0.55 ≈ 1.82) */
        .login-box {
            zoom: 1.82;
            background: #3B3A3A;
            border-radius: 18px;
            padding: 28px 28px 24px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .login-box h1 { font-size: 20px; font-weight: 600; margin-bottom: 18px; }
        .login-box input {
            width: 100%;
            height: 42px;
            margin-bottom: 10px;
            padding: 0 12px;
            border-radius: 9px;
            border: 1px solid #555;
            background: #1A1A1A;
            color: white;
            font-size: 16px;   /* mind. 16px, sonst zoomt iOS beim Tippen rein */
            outline: none;
        }
        .login-box input:focus { border-color: #fff; }
        .login-box button {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 9px;
            background: #FFFFFF;
            color: #000000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .login-box button:hover { background: #e0e0e0; }
        #login-error { height: 18px; margin-top: 10px; font-size: 13px; color: #ff6b6b; }
        .shake { animation: shake 0.35s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }


        /* =====================================================================
           Styling v3: flach und ruhig, gleiche Farbpalette, gleiche Schrift (Arial)
           ===================================================================== */
        .header { font-size: 48px; font-weight: 600; }
        .widget, .widget-wrapper, .stock-col { background: #3B3A3A; border-radius: 20px; }
        .widget-transparent { border-radius: 20px; }
        .widget-title { font-size: 22px; font-weight: 600; padding-bottom: 9px; margin-bottom: 9px; border-bottom: 1px solid rgba(255, 255, 255, 0.09); }
        ::selection { background: #fff; color: #000; }
        .ticker-item { background: #1A1A1A; border-radius: 12px; }

        /* Knöpfe */
        .white-btn-style { border-radius: 12px; font-weight: 600; transition: background-color .15s ease; text-decoration: none; }
        .white-btn-style:hover { background: #e6e6e6 !important; }
        .white-btn-style:active { background: #d4d4d4 !important; }
        .zoom-btn { border-radius: 12px; background: rgba(255, 255, 255, 0.10); transition: background-color .15s ease; }
        .zoom-btn:hover { background: rgba(255, 255, 255, 0.24); }
        .zoom-btn:focus-visible, .white-btn-style:focus-visible, .bs-chip:focus-visible, .bs-seg button:focus-visible, .bs-kpi:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

        /* Lupe: Titel links mit feiner Trennlinie, Kante um die vergrösserte Karte */
        .focused { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10), 0 30px 100px rgba(0, 0, 0, 0.8); }
        .stocks-panel.focused { box-shadow: none; }
        .focused:not(.stocks-panel):not(.bs-card) > .widget-title { text-align: left; font-size: 24px; padding: 2px 70px 12px 2px; margin-bottom: 0; }
        #focus-backdrop { background: rgba(5, 5, 5, 0.78); }

        /* Mappe / Glühbirne: 4 gleiche Spalten */
        .stock-col { padding: 22px; }
        .stock-title { font-size: 30px; font-weight: 700; }
        .stock-col .sym-box, .stock-col .fin-box, .stock-col .ta-box { border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.07); }
        .stock-title { margin-bottom: 14px; }
        .stock-actions { display: flex; gap: 8px; margin-bottom: 9px; }
        .stock-actions .white-btn-style { flex: 1; width: auto; height: 50px; margin-bottom: 0; font-size: 17px; }
        .stock-actions .white-btn-style:last-child { flex: 1.5; }

        /* Einblendung: ruhig von links nach rechts gestaffelt */
        @keyframes riseIn { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }
        body.unlocked .header-container { animation: riseIn .7s ease-out 0.9s forwards; }
        body.unlocked .widget, body.unlocked .widget-transparent, body.unlocked .widget-wrapper { animation: riseIn .7s ease-out calc(1.05s + var(--d, 0ms)) forwards; }
        .dashboard > :nth-child(1) { --d: 0ms; }   .dashboard > :nth-child(2) { --d: 60ms; }
        .dashboard > :nth-child(3) { --d: 120ms; } .dashboard > :nth-child(4) { --d: 180ms; }
        .dashboard > :nth-child(5) { --d: 240ms; } .dashboard > :nth-child(6) { --d: 300ms; }
        .dashboard > :nth-child(7) { --d: 360ms; } .dashboard > :nth-child(n+8) { --d: 420ms; }
        @media (prefers-reduced-motion: reduce) {
            body.unlocked .header-container, body.unlocked .widget, body.unlocked .widget-transparent, body.unlocked .widget-wrapper { animation: fadeInAll .3s ease-out forwards; }
            .bs-bar { animation: none; }
        }

        /* Login */
        .login-box { border-radius: 20px; }
        .login-box input, .login-box button { border-radius: 12px; }

        /* Balance-sheet-Overlay */
        .widget.bs-card { font-variant-numeric: tabular-nums; }
        .bs-panel, .bs-kpi { border-radius: 16px; }
        .bs-kpi .k-l, .bs-lbl, .bs-chips .g, .bs-h, .bs-ins b { font-size: 13px; letter-spacing: 0; font-weight: 600; color: #a8a8a8; }

        /* =====================================================================
           Styling v4: Kopfzeile links, Titel links, Link-Listen statt Knopf-Stapel
           ===================================================================== */
        .header-container { flex-direction: row; justify-content: space-between; align-items: flex-end; width: 2432px; margin: 0 auto 34px; padding-bottom: 22px; border-bottom: 1px solid rgba(255, 255, 255, 0.09); }
        .header-left { display: flex; flex-direction: column; gap: 8px; }
        .header { font-size: 46px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; }
        .header-date { font-size: 20px; color: #a8a8a8; }
        .clock-container { margin: 0 4px 0 0; transform-origin: right bottom; }

        /* Titel links, Symbole rechts oben */
        .widget-title { text-align: left; padding-bottom: 14px; margin-bottom: 0; }
        .widget-title + * { margin-top: 6px; }
        .stock-title { border-bottom: none; padding-bottom: 0; margin-bottom: 4px; }
        .zoom-btn-left { left: auto; right: 73px; }

        /* Rechte Spalten: eine ruhige Karte mit Link-Zeilen */
        .widget-transparent { background: #3B3A3A; backdrop-filter: none; }
        .widget-transparent .white-btn-style { background: transparent !important; color: #fff !important; justify-content: space-between; padding: 0 16px; height: 50px; margin-bottom: 4px; font-size: 19px; font-weight: 500; border-radius: 12px; }

<!-- Login: echtes Formular mit username + current-password, damit Apple (Safari / iCloud-Schlüsselbund) Autofill anbietet.
     method="get" + action + onsubmit sorgen dafür, dass das Formular NIE per POST an den Server geschickt wird (Fehler 405). -->
<div id="login-overlay">
    <form id="login-form" class="login-box" method="get" action="javascript:void(0)" onsubmit="return false;" autocomplete="on">
        <h1>Stock Overview</h1>
        <input type="text" id="username" autocomplete="username" placeholder="Username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <input type="password" id="password" autocomplete="current-password" placeholder="Password" required>
        <button type="submit">Unlock</button>
        <div id="login-error"></div>
    </form>
</div>

<!-- Login-Logik (steht direkt hinter dem Formular, damit der Login sofort aktiv ist, auch wenn der Rest der Seite noch lädt) -->
<script>
    // SHA-256-Hash deines Passworts (aktuell: "DavidSt").
    // Eigenen Hash erzeugen: in der Browser-Konsole ausführen (MEIN_PASSWORT ersetzen):
    // crypto.subtle.digest('SHA-256', new TextEncoder().encode('MEIN_PASSWORT')).then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('')))
    const PASSWORD_HASH = '2f207ea71ea0b7a9ee3c104b465bc05fa1b895965cf86786e5d17e64918e5956';

    async function sha256(text) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const overlay = document.getElementById('login-overlay');

    function unlock() {
        document.body.classList.add('unlocked');   // startet Intro-Animation
        overlay.classList.add('hide');
        setTimeout(() => overlay.remove(), 450);   // Formular entfernen -> Safari bietet "Passwort sichern" an
    }

    async function attemptLogin() {
        errorBox.textContent = '';

        if (!window.crypto || !window.crypto.subtle) {
            errorBox.textContent = 'Please open this page via https.';
            return;
        }

        const pw = document.getElementById('password').value;
        if ((await sha256(pw)) === PASSWORD_HASH) {
            unlock();
        } else {
            errorBox.textContent = 'Wrong password';
            form.classList.remove('shake');
            void form.offsetWidth;                 // Animation neu starten
            form.classList.add('shake');
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    }

    form.addEventListener('submit', (e) => { e.preventDefault(); attemptLogin(); });

    // Passwort-Manager / AutoFill (z.B. Apple Passwörter, 1Password) rufen teils form.submit() direkt auf.
    // Das löst kein "submit"-Event aus -> hier abfangen, damit die Seite nicht neu geladen wird.
    form.submit = () => attemptLogin();
</script>

<!-- Fokus-Modus (Lupe / Kreuz) -->
<script>
    (function () {
        const PAGE_ZOOM = 0.55;   // gleicher Wert wie body { zoom: 0.55 }
        const MAX_SCALE = 2;      // doppelt so gross
        const backdrop = document.getElementById('focus-backdrop');
        let current = null;
        let spacer = null;

        const ICONS =
            '<svg class="ico-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>' +
            '<svg class="ico-close" viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>';

        function openFocus(el, keepReturn) {
            if (current) closeFocus(false);

            // Grösse des Widgets (CSS-Pixel) -> passt den Zoom-Faktor an kleine Bildschirme an
            const w = parseFloat(el.dataset.focusW) || (el.classList.contains('w-wide') ? 950 : 456);
            const h = parseFloat(el.dataset.focusH) || 420;
            const scale = Math.min(
                MAX_SCALE,
                (window.innerWidth  * 0.94) / (w * PAGE_ZOOM),
                (window.innerHeight * 0.94) / (h * PAGE_ZOOM)
            );

            // Platzhalter, damit das Layout an seinem Platz bleibt (nicht nötig für Popups wie BTC Seasonal)
            if (!el.hasAttribute('data-popup')) {
                spacer = document.createElement('div');
                spacer.style.width = w + 'px';
                spacer.style.height = h + 'px';
                spacer.style.gridColumn = el.style.gridColumn;
                el.parentNode.insertBefore(spacer, el);
            }

            el.style.setProperty('--focus-scale', scale);
            el.classList.add('focused');
            backdrop.classList.add('show');
            current = el;
            setLabel(el, true);
        }

        let finCard = null;     // Financials-Popup (wird beim Klick auf die Lupe erzeugt)
        let returnTo = null;    // Panel, das nach dem Schliessen des Popups wieder aufgeht

        function closeFocus(reopen = true) {
            if (!current) return;
            const closing = current;
            current.classList.remove('focused');
            if (spacer) { spacer.remove(); spacer = null; }
            backdrop.classList.remove('show');
            setLabel(current, false);
            current = null;
            if (closing === finCard) {
                finCard.remove();
                finCard = null;
                const back = returnTo;
                returnTo = null;
                if (back && reopen) openFocus(back);
            }
        }


        // ---------- Balance sheet: interaktives Overlay (Daten aus BALANCE_DATA) ----------
        const BS_METRICS = [
            { k: 'rev', label: 'Revenue', kind: 'money', good: 1, grp: 'Income' },
            { k: 'gp', label: 'Gross profit', kind: 'money', good: 1, grp: 'Income' },
            { k: 'ni', label: 'Net income', kind: 'money', good: 1, grp: 'Income' },
            { k: 'cash', label: 'Cash', kind: 'money', good: 1, grp: 'Balance' },
            { k: 'debt', label: 'Debt', kind: 'money', good: -1, grp: 'Balance' },
            { k: 'netcash', label: 'Net cash', kind: 'money', good: 1, grp: 'Balance' },
            { k: 'eq', label: 'Equity', kind: 'money', good: 1, grp: 'Balance' },
            { k: 'ta', label: 'Total assets', kind: 'money', good: 0, grp: 'Balance' },
            { k: 'tl', label: 'Total liabilities', kind: 'money', good: 0, grp: 'Balance' },
            { k: 'dep', label: 'Deposits', kind: 'money', good: 1, grp: 'Balance' },
            { k: 'pref', label: 'Preferred stock', kind: 'money', good: 0, grp: 'Balance' },
            { k: 'yoy', label: 'Growth YoY', kind: 'pct', good: 1, grp: 'Ratios' },
            { k: 'qoq', label: 'Growth QoQ', kind: 'pct', good: 1, grp: 'Ratios', only: 'quarterly' },
            { k: 'gm', label: 'Gross margin', kind: 'pct', good: 1, grp: 'Ratios' },
            { k: 'nm', label: 'Net margin', kind: 'pct', good: 1, grp: 'Ratios' },
            { k: 'de', label: 'Debt / equity', kind: 'ratio', good: -1, grp: 'Ratios' },
            { k: 'members', label: 'Members', kind: 'count', unit: 'Mio', good: 1, grp: 'KPIs' },
            { k: 'products', label: 'Products', kind: 'count', unit: 'Mio', good: 1, grp: 'KPIs' },
            { k: 'rpm', label: 'Revenue / member', kind: 'usd', good: 1, grp: 'KPIs' }
        ];
        const BS_FLOW = ['rev', 'gp', 'ni'];
        const BS = { sym: null, d: null, mode: 'quarterly', range: 8, metric: 'rev', overlay: 'yoy', sel: null, rows: [], vis: [], card: null };

        function bsBuild(d, mode) {
            const q = d.quarterly || [], y = d.yearly || [];
            let base;
            if (mode === 'ttm') {
                base = [];
                q.forEach((r, i) => {
                    if (i < 3) return;
                    const o = Object.assign({}, r);
                    delete o.pyRev;
                    BS_FLOW.forEach((k) => {
                        const v = [0, 1, 2, 3].map((j) => q[i - j][k]);
                        o[k] = v.every((x) => x != null) ? v.reduce((a, b) => a + b, 0) : null;
                    });
                    base.push(o);
                });
            } else base = (mode === 'yearly' ? y : q).map((r) => Object.assign({}, r));
            const lag = mode === 'yearly' ? 1 : 4;
            base.forEach((o, i) => {
                const prev = i >= lag ? base[i - lag] : null;
                if (o.rev != null) {
                    if (prev && prev.rev) o.yoy = (o.rev / prev.rev - 1) * 100;
                    else if (o.pyRev) o.yoy = (o.rev / o.pyRev - 1) * 100;
                }
                if (mode === 'quarterly' && i > 0 && base[i - 1].rev && o.rev != null) o.qoq = (o.rev / base[i - 1].rev - 1) * 100;
                if (o.gp != null && o.rev) o.gm = o.gp / o.rev * 100;
                if (o.ni != null && o.rev >= 1 && Math.abs(o.ni / o.rev) < 10) o.nm = o.ni / o.rev * 100;
                if (o.cash != null) o.netcash = o.cash - (o.debt || 0);
                if (o.debt != null && o.eq) o.de = o.debt / o.eq;
                if (o.members && o.rev != null) o.rpm = o.rev / o.members * (mode === 'quarterly' ? 4 : 1);
            });
            return base;
        }
        function bsAvail(rows) {
            const only = (m) => !m.only || m.only === BS.mode;
            return BS_METRICS.filter((m) => only(m) && rows.some((r) => r[m.k] != null));
        }
        function bsLab(m) { return (BS.d.labels && BS.d.labels[m.k]) || m.label; }
        // Formatierer mit automatischer Einheit (Mio / Mrd) je Kennzahl
        function bsFmt(m, vals) {
            const nf = (v, dec) => v.toLocaleString('de-CH', { minimumFractionDigits: dec, maximumFractionDigits: dec });
            const mx = Math.max(0, ...vals.filter((v) => v != null).map(Math.abs));
            if (m.kind === 'money') {
                const big = mx >= 5000;
                const dec = big ? (mx >= 100000 ? 1 : 2) : (mx >= 1000 ? 0 : (mx >= 10 ? 1 : 2));
                const unit = big ? 'Mrd' : 'Mio';
                const f = (v) => v == null ? '–' : nf(big ? v / 1000 : v, dec);
                return { f, unit, full: (v) => v == null ? '–' : f(v) + ' ' + unit };
            }
            if (m.kind === 'count') { const f = (v) => v == null ? '–' : nf(v, 2); return { f, unit: m.unit, full: (v) => f(v) + ' ' + m.unit }; }
            if (m.kind === 'pct') { const f = (v) => v == null ? '–' : (v > 0 && m.k !== 'gm' && m.k !== 'nm' ? '+' : '') + nf(v, 1) + '%'; return { f, unit: '%', full: f }; }
            if (m.kind === 'ratio') { const f = (v) => v == null ? '–' : nf(v, 2) + '×'; return { f, unit: '×', full: f }; }
            const f = (v) => v == null ? '–' : '$' + nf(v, 0);
            return { f, unit: 'USD', full: f };
        }
        function bsDelta(rows, i, m) {
            const lag = BS.mode === 'yearly' ? 1 : 4;
            const r = rows[i], p = i >= lag ? rows[i - lag] : null;
            let a = r[m.k], b = p ? p[m.k] : null, txt = '', dir = 0;
            if (a == null || b == null) {
                if (m.k === 'rev' && r.yoy != null) { txt = (r.yoy > 0 ? '+' : '') + r.yoy.toFixed(1) + '%'; dir = Math.sign(r.yoy); }
                else return { txt: '', cls: 'flat' };
            } else if (m.kind === 'pct') { const dd = a - b; txt = (dd > 0 ? '+' : '') + dd.toFixed(1) + ' pp'; dir = Math.sign(dd); }
            else if (m.kind === 'ratio') { const dd = a - b; txt = (dd > 0 ? '+' : '') + dd.toFixed(2) + '×'; dir = Math.sign(dd); }
            else if (b > 0 && a >= 0) { const pc = (a / b - 1) * 100; txt = (pc > 0 ? '+' : '') + (Math.abs(pc) >= 1000 ? pc.toFixed(0) : pc.toFixed(1)) + '%'; dir = Math.sign(pc); }
            else { const dd = a - b; const f = bsFmt(m, [a, b]); txt = (dd > 0 ? '+' : '') + f.f(dd) + ' ' + f.unit; dir = Math.sign(dd); }
            const g = m.good || 0;
            return { txt, cls: dir === 0 || g === 0 ? 'flat' : (dir * g > 0 ? 'up' : 'down') };
        }
        function bsNiceStep(raw) {
            const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
            return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
        }
        function bsScale(vals, bar) {
            let lo = Math.min(...vals), hi = Math.max(...vals);
            if (bar) { lo = Math.min(0, lo); hi = Math.max(0, hi); }
            else { const pad = (hi - lo) * 0.18 || Math.abs(hi) * 0.1 || 1; lo -= pad; hi += pad; }
            if (hi === lo) hi = lo + 1;
            const step = bsNiceStep((hi - lo) / 4);
            lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
            const ticks = [];
            for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(10));
            return { lo, hi, ticks };
        }
        function bsSpark(vals, color) {
            const v = vals.map((x) => x == null ? null : x), nn = v.filter((x) => x != null);
            if (nn.length < 2) return '';
            const lo = Math.min(...nn), hi = Math.max(...nn), W = 200, H = 30;
            const pts = [];
            v.forEach((x, i) => { if (x != null) pts.push((i / (v.length - 1) * (W - 6) + 3).toFixed(1) + ',' + (H - 4 - (hi === lo ? 0.5 : (x - lo) / (hi - lo)) * (H - 8)).toFixed(1)); });
            return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
        }
        function bsEsc(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

        function bsChart() {
            const m = BS_METRICS.find((x) => x.k === BS.metric), vis = BS.vis;
            const vals = vis.map((r) => r[m.k]).filter((v) => v != null);
            if (!vals.length) return '<div class="bs-empty">No figures for this metric in the selected range.</div>';
            const bar = m.kind === 'money' || m.kind === 'count';
            const ov = (BS.overlay !== 'none' && BS.overlay !== m.k && bar) ? BS_METRICS.find((x) => x.k === BS.overlay) : null;
            const ovVals = ov ? vis.map((r) => r[ov.k]).filter((v) => v != null) : [];
            const useOv = ov && ovVals.length > 1;
            const W = 900, H = 410, L = 74, R = useOv ? 66 : 22, T = 30, B = 44;
            const n = vis.length, slot = (W - L - R) / n;
            const sc = bsScale(vals, bar), F = bsFmt(m, vals);
            const y = (v) => T + (sc.hi - v) / (sc.hi - sc.lo) * (H - T - B);
            const cx = (i) => L + slot * i + slot / 2;
            let s = '';
            sc.ticks.forEach((t) => {
                s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="' + (t === 0 ? '#777' : '#2e2e2e') + '"/>' +
                    '<text x="' + (L - 10) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="13" fill="#9a9a9a">' + F.f(t) + '</text>';
            });
            s += '<text x="' + (L - 10) + '" y="14" text-anchor="end" font-size="12" fill="#6f6f6f">' + F.unit + '</text>';
            let sc2 = null, F2 = null;
            if (useOv) {
                sc2 = bsScale(ovVals, false); F2 = bsFmt(ov, ovVals);
                const y2 = (v) => T + (sc2.hi - v) / (sc2.hi - sc2.lo) * (H - T - B);
                sc2.ticks.forEach((t) => { s += '<text x="' + (W - R + 10) + '" y="' + (y2(t) + 4) + '" font-size="13" fill="#6cc4ff">' + F2.f(t) + '</text>'; });
                sc2.y = y2;
            }
            const lbl = n <= 12;
            vis.forEach((r, i) => {
                const v = r[m.k], sel = r.p === BS.sel;
                s += '<g class="bs-slot' + (sel ? ' sel' : '') + '" data-i="' + i + '"><rect class="bs-band" x="' + (L + slot * i) + '" y="' + T + '" width="' + slot + '" height="' + (H - T - B) + '" rx="6"/>';
                if (v != null && bar) {
                    const bw = Math.min(slot * 0.62, 70), y0 = y(0), yy = y(v), h = Math.max(1.5, Math.abs(yy - y0)), yt = Math.min(yy, y0);
                    s += '<rect class="bs-bar" x="' + (cx(i) - bw / 2) + '" y="' + yt + '" width="' + bw + '" height="' + h + '" rx="4" fill="' + (v < 0 ? '#ff6b6b' : '#fff') + '" style="animation-delay:' + (i * 25) + 'ms"/>';
                    if (lbl || sel) s += '<text x="' + cx(i) + '" y="' + (v >= 0 ? yt - 7 : yt + h + 15) + '" text-anchor="middle" font-size="' + (n > 8 ? 12 : 13.5) + '" font-weight="600" fill="' + (sel ? '#fff' : '#cfcfcf') + '">' + F.f(v) + '</text>';
                }
                s += '<text x="' + cx(i) + '" y="' + (H - 16) + '" text-anchor="middle" font-size="' + (n > 12 ? 11.5 : 13) + '" fill="' + (sel ? '#fff' : '#9a9a9a') + '" font-weight="' + (sel ? 700 : 400) + '">' + r.p + '</text>';
                if (BS.d.notes && BS.d.notes[r.p]) s += '<circle cx="' + cx(i) + '" cy="' + (T - 12) + '" r="6" fill="#ffd27a"/><text x="' + cx(i) + '" y="' + (T - 8) + '" text-anchor="middle" font-size="10" font-weight="800" fill="#2a1d00">!</text>';
                s += '<rect class="bs-hit" x="' + (L + slot * i) + '" y="0" width="' + slot + '" height="' + H + '"/></g>';
            });
            if (!bar) {
                let d = '', dots = '', prev = false;
                vis.forEach((r, i) => {
                    const v = r[m.k];
                    if (v == null) { prev = false; return; }
                    d += (prev ? 'L' : 'M') + cx(i) + ' ' + y(v) + ' '; prev = true;
                    const sel = r.p === BS.sel;
                    dots += '<circle cx="' + cx(i) + '" cy="' + y(v) + '" r="' + (sel ? 7 : 4.5) + '" fill="' + (v < 0 ? '#ff6b6b' : '#fff') + '" pointer-events="none"/>';
                    if (lbl || sel) dots += '<text x="' + cx(i) + '" y="' + (y(v) - 12) + '" text-anchor="middle" font-size="13" font-weight="600" fill="' + (sel ? '#fff' : '#cfcfcf') + '" pointer-events="none">' + F.f(v) + '</text>';
                });
                s += '<path d="' + d + '" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" pointer-events="none"/>' + dots;
            }
            if (useOv) {
                let d = '', dots = '', prev = false;
                if (sc2.lo < 0 && sc2.hi > 0) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + sc2.y(0) + '" y2="' + sc2.y(0) + '" stroke="#6cc4ff" stroke-opacity=".35" stroke-dasharray="4 5"/>';
                vis.forEach((r, i) => {
                    const v = r[ov.k];
                    if (v == null) { prev = false; return; }
                    d += (prev ? 'L' : 'M') + cx(i) + ' ' + sc2.y(v) + ' '; prev = true;
                    dots += '<circle cx="' + cx(i) + '" cy="' + sc2.y(v) + '" r="' + (r.p === BS.sel ? 6 : 4) + '" fill="#6cc4ff" stroke="#0b0b0b" stroke-width="1.5" pointer-events="none"/>';
                });
                s += '<path d="' + d + '" fill="none" stroke="#6cc4ff" stroke-width="2.5" stroke-linejoin="round" pointer-events="none"/>' + dots;
            }
            return '<svg viewBox="0 0 ' + W + ' ' + H + '">' + s + '</svg><div class="bs-tip" id="bs-tip"></div>';
        }

        function bsTipHtml(r) {
            const m = BS_METRICS.find((x) => x.k === BS.metric);
            const rowsHtml = [];
            const add = (mm) => {
                if (r[mm.k] == null) return;
                const F = bsFmt(mm, BS.rows.map((x) => x[mm.k]));
                rowsHtml.push('<div><span>' + bsLab(mm) + '</span><span>' + F.full(r[mm.k]) + '</span></div>');
            };
            add(m);
            ['yoy', 'gm', 'nm', 'ni', 'cash'].forEach((k) => { if (k !== m.k) { const mm = BS_METRICS.find((x) => x.k === k); if (mm && (k === BS.overlay || ['yoy', 'ni'].includes(k))) add(mm); } });
            const note = BS.d.notes && BS.d.notes[r.p];
            return '<b>' + r.p + '</b>' + rowsHtml.join('') + (note ? '<em>' + bsEsc(note) + '</em>' : '');
        }

        function bsKpis() {
            const avail = bsAvail(BS.rows).map((m) => m.k);
            const pref = ['rev', 'gm', 'nm', 'ni', 'cash', 'debt', 'netcash', 'members', 'eq'];
            const want = pref.filter((k) => avail.includes(k)).filter((k) => !(k === 'nm' && avail.includes('gm')) && !(k === 'netcash' && avail.includes('debt'))).slice(0, 6);
            const idx = BS.rows.findIndex((r) => r.p === BS.sel);
            let html = '';
            want.forEach((k) => {
                const m = BS_METRICS.find((x) => x.k === k);
                const vals = BS.vis.map((r) => r[k]);
                const F = bsFmt(m, vals), r = BS.rows[idx], dl = bsDelta(BS.rows, idx, m);
                const col = dl.cls === 'down' ? '#ff7b7b' : '#cfcfcf';
                html += '<button type="button" class="bs-kpi' + (BS.metric === k ? ' on' : '') + '" data-m="' + k + '"><div class="k-l">' + bsLab(m) + '</div><div class="k-v">' + F.f(r[k]) + '<small>' + F.unit + '</small></div><div class="k-d ' + dl.cls + '">' + (dl.txt ? dl.txt + ' <span style="color:#8f8f8f;font-weight:400">vs. ' + (BS.mode === 'yearly' ? 'prior year' : 'year ago') + '</span>' : '&nbsp;') + '</div>' + bsSpark(vals, col) + '</button>';
            });
            return html;
        }

        function bsDetail() {
            const idx = BS.rows.findIndex((r) => r.p === BS.sel), r = BS.rows[idx];
            let html = '<div class="bs-h">' + BS.sel + ' – all figures</div><table class="bs-det"><tbody>';
            bsAvail(BS.rows).forEach((m) => {
                if (r[m.k] == null) return;
                const F = bsFmt(m, BS.rows.map((x) => x[m.k])), dl = bsDelta(BS.rows, idx, m);
                html += '<tr><td>' + bsLab(m) + '</td><td>' + F.f(r[m.k]) + ' <span style="color:#8f8f8f;font-weight:400">' + F.unit + '</span></td><td class="' + dl.cls + '">' + dl.txt + '</td></tr>';
            });
            html += '</tbody></table>';
            const note = BS.d.notes && BS.d.notes[BS.sel];
            if (note) html += '<div class="bs-note"><b>Note:</b> ' + bsEsc(note) + '</div>';
            html += '<div style="font-size:11.5px;color:#8f8f8f;margin-top:8px">Right column: change vs. ' + (BS.mode === 'yearly' ? 'prior year' : 'same period a year ago') + '.</div>';
            return html;
        }

        function bsInsights() {
            const d = BS.d, q = bsBuild(d, 'ttm'), yr = bsBuild(d, 'yearly'), qq = bsBuild(d, 'quarterly');
            const out = [];
            const money = (k, v) => { const F = bsFmt(BS_METRICS.find((m) => m.k === k), [v]); return (v < 0 ? '−' : '') + '$' + F.f(Math.abs(v)) + ' ' + F.unit; };
            const L = q[q.length - 1], Q = qq[qq.length - 1];
            if (L && L.rev != null) out.push(['Scale (trailing 12 months)', 'Revenue ' + money('rev', L.rev) + (L.yoy != null ? ' (' + (L.yoy > 0 ? '+' : '') + L.yoy.toFixed(0) + '% YoY)' : '') + (L.ni != null ? ', net income ' + money('ni', L.ni) + (L.nm != null ? ' (' + L.nm.toFixed(1) + '% margin)' : '') : '') + '.']);
            else if (L && L.ni != null) out.push(['Trailing 12 months', 'Net income ' + money('ni', L.ni) + '. Revenue is still negligible or not reported.']);
            const yv = yr.filter((r) => r.rev);
            if (yv.length >= 3) { const a = yv[0], b = yv[yv.length - 1], n = yv.length - 1; out.push(['Long-term growth', 'Revenue ' + money('rev', a.rev) + ' (' + a.p + ') → ' + money('rev', b.rev) + ' (' + b.p + '): ' + ((Math.pow(b.rev / a.rev, 1 / n) - 1) * 100).toFixed(1) + '% per year.']); }
            if (Q && Q.gm != null) { const p = qq[qq.length - 5]; out.push(['Gross margin', Q.gm.toFixed(1) + '% in ' + Q.p + (p && p.gm != null ? ' vs. ' + p.gm.toFixed(1) + '% a year earlier (' + (Q.gm - p.gm > 0 ? '+' : '') + (Q.gm - p.gm).toFixed(1) + ' pp)' : '') + '.']); }
            const last8 = qq.slice(-8).filter((r) => r.ni != null);
            if (last8.length >= 4) out.push(['Profitability', last8.filter((r) => r.ni > 0).length + ' of the last ' + last8.length + ' quarters were profitable. Best: ' + last8.reduce((a, b) => b.ni > a.ni ? b : a).p + ', worst: ' + last8.reduce((a, b) => b.ni < a.ni ? b : a).p + ' (net income).']);
            if (Q && Q.cash != null) {
                const debt = Q.debt;
                out.push(['Balance sheet', 'Cash ' + money('cash', Q.cash) + (debt ? ' vs. debt ' + money('debt', debt) + ' → ' + (Q.netcash >= 0 ? 'net cash ' : 'net debt ') + money('netcash', Math.abs(Q.netcash)) : ' and no financial debt') + (Q.de != null ? '; debt/equity ' + Q.de.toFixed(2) + '×' : '') + '.']);
            }
            if (L && L.ni != null && L.ni < 0 && Q && Q.cash) out.push(['Cash runway (simplified)', 'At the trailing net loss of ' + money('ni', -L.ni) + ' per year, cash of ' + money('cash', Q.cash) + ' lasts about ' + (Q.cash / -L.ni).toFixed(1) + ' years, ignoring financing and interest income.']);
            const g = qq.filter((r) => r.yoy != null).slice(-8);
            if (g.length >= 4) { const hi = g.reduce((a, b) => b.yoy > a.yoy ? b : a), lo = g.reduce((a, b) => b.yoy < a.yoy ? b : a); out.push(['Growth momentum (last 8 quarters)', 'Fastest: ' + hi.p + ' (' + (hi.yoy > 0 ? '+' : '') + hi.yoy.toFixed(0) + '%), slowest: ' + lo.p + ' (' + (lo.yoy > 0 ? '+' : '') + lo.yoy.toFixed(0) + '%) YoY.']); }
            if (Q && Q.members) { const p = qq[qq.length - 5]; out.push(['Members & monetisation', Q.members.toFixed(2) + ' Mio members' + (p && p.members ? ' (' + ((Q.members / p.members - 1) * 100).toFixed(0) + '% YoY)' : '') + ', ' + (Q.products ? Q.products.toFixed(1) + ' Mio products, ' : '') + 'revenue per member ≈ $' + Math.round(Q.rpm) + ' per year (annualised).']); }
            if (Q && Q.dep) { const p = qq[qq.length - 5]; out.push(['Deposits', money('dep', Q.dep) + (p && p.dep ? ' (' + ((Q.dep / p.dep - 1) * 100).toFixed(0) + '% YoY)' : '') + ' – ' + (Q.ta ? (Q.dep / Q.ta * 100).toFixed(0) + '% of total assets' : '') + '.']); }
            const nn = Object.keys(d.notes || {}).length;
            if (nn) out.push(['Flagged periods', nn + ' period' + (nn > 1 ? 's' : '') + ' carry a footnote (yellow “!” on the chart) – one-offs that distort the headline numbers.']);
            return out;
        }

        function bsTable() {
            const rows = BS.vis;
            let html = '<table class="bs-table"><thead><tr><th>' + 'Metric</th>' + rows.map((r) => '<th data-p="' + r.p + '" class="' + (r.p === BS.sel ? 'selc' : '') + '">' + r.p + '</th>').join('') + '</tr></thead><tbody>';
            let grp = '';
            bsAvail(BS.rows).forEach((m) => {
                if (m.grp !== grp) { grp = m.grp; html += '<tr><td class="grp" colspan="' + (rows.length + 1) + '">' + grp + '</td></tr>'; }
                const F = bsFmt(m, rows.map((r) => r[m.k]));
                const mx = Math.max(1e-9, ...rows.map((r) => Math.abs(r[m.k] || 0)));
                html += '<tr><td>' + bsLab(m) + ' <span style="color:#6f6f6f;font-size:12px">' + F.unit + '</span></td>' + rows.map((r) => {
                    const v = r[m.k];
                    let st = '';
                    if (v != null && (m.kind === 'pct' || m.k === 'ni')) st = ' style="color:' + (v < 0 ? '#ff7b7b' : '#e8e8e8') + ';background:' + (v < 0 ? 'rgba(255,107,107,' : 'rgba(94,211,154,') + (0.05 + 0.2 * Math.min(1, Math.abs(v) / mx)).toFixed(2) + ')"';
                    return '<td data-p="' + r.p + '" class="' + (r.p === BS.sel ? 'selc' : '') + '"' + st + '>' + F.f(v) + '</td>';
                }).join('') + '</tr>';
            });
            return html + '</tbody></table>';
        }
        function bsCsv() {
            const rows = BS.vis;
            const lines = [['Metric'].concat(rows.map((r) => r.p)).join('\t')];
            bsAvail(BS.rows).forEach((m) => {
                const F = bsFmt(m, rows.map((r) => r[m.k]));
                lines.push([bsLab(m) + ' (' + F.unit + ')'].concat(rows.map((r) => r[m.k] == null ? '' : F.f(r[m.k]))).join('\t'));
            });
            return lines.join('\n');
        }

        function bsDraw() {
            const c = BS.card;
            BS.rows = bsBuild(BS.d, BS.mode);
            const total = BS.rows.length;
            BS.vis = (BS.mode === 'yearly' || BS.range === 'all') ? BS.rows : BS.rows.slice(-BS.range);
            if (!BS.rows.some((r) => r.p === BS.sel)) BS.sel = BS.rows.length ? BS.rows[BS.rows.length - 1].p : null;
            if (!BS.vis.some((r) => r.p === BS.sel)) BS.sel = BS.vis[BS.vis.length - 1].p;
            const av = bsAvail(BS.rows);
            if (!av.some((m) => m.k === BS.metric)) BS.metric = av[0].k;
            const seg = (id, items, cur) => '<div class="bs-seg" data-seg="' + id + '">' + items.map((it) => '<button type="button" data-v="' + it[0] + '" class="' + (String(cur) === String(it[0]) ? 'on' : '') + '">' + it[1] + '</button>').join('') + '</div>';
            const modes = [['quarterly', 'Quarterly'], ['yearly', 'Yearly']];
            if ((BS.d.quarterly || []).length >= 8) modes.splice(1, 0, ['ttm', 'TTM']);
            let bar = '<span class="bs-lbl">View</span>' + seg('mode', modes, BS.mode);
            if (BS.mode !== 'yearly') bar += '<span class="bs-lbl">Range</span>' + seg('range', [[8, 'Last 8'], [12, 'Last 12'], ['all', 'All (' + total + ')']], BS.range);
            c.querySelector('.bs-bar').innerHTML = bar;
            c.querySelector('.bs-kpis').innerHTML = bsKpis();
            let chips = '', g = '';
            av.forEach((m) => { if (m.grp !== g) { g = m.grp; chips += '<span class="g">' + g + '</span>'; } chips += '<button type="button" class="bs-chip' + (BS.metric === m.k ? ' on' : '') + '" data-m="' + m.k + '">' + bsLab(m) + '</button>'; });
            c.querySelector('.bs-chips').innerHTML = chips;
            const mm = BS_METRICS.find((x) => x.k === BS.metric);
            const ovOpts = ['none', 'yoy', 'gm', 'nm'].filter((k) => k === 'none' || av.some((m) => m.k === k));
            c.querySelector('.bs-ovr').innerHTML = (mm.kind === 'money' || mm.kind === 'count') && ovOpts.length > 1 ?
                '<span class="bs-lbl" style="margin-right:2px">Overlay line</span>' + ovOpts.map((k) => '<button type="button" class="bs-chip' + (BS.overlay === k ? ' on' : '') + '" data-o="' + k + '">' + (k === 'none' ? 'off' : bsLab(BS_METRICS.find((x) => x.k === k))) + '</button>').join('') : '';
            c.querySelector('.bs-chart').innerHTML = bsChart();
            c.querySelector('.bs-detail').innerHTML = bsDetail();
            c.querySelector('.bs-tblwrap').innerHTML = bsTable();
        }

        function bsSelect(p) { BS.sel = p; bsDraw(); }

        function openBalance(sym, panel) {
            const d = BALANCE_DATA[sym];
            if (finCard) { finCard.remove(); finCard = null; }
            const card = document.createElement('div');
            card.className = 'widget popup-card bs-card';
            card.setAttribute('data-popup', '');
            card.dataset.focusW = '1500';
            card.dataset.focusH = '1000';
            const x = document.createElement('button');
            x.type = 'button';
            x.className = 'zoom-btn';
            x.title = 'Close';
            x.setAttribute('aria-label', 'Close');
            x.innerHTML = ICONS;
            x.addEventListener('click', (e) => { e.stopPropagation(); closeFocus(); });
            card.appendChild(x);
            if (!d) {
                card.insertAdjacentHTML('beforeend', '<div class="bs-top"><span class="bs-title">' + sym + '</span></div><div class="bs-empty">No figures entered yet for ' + sym + '.</div>');
            } else {
                const lastQ = (d.quarterly || []).slice(-1)[0] || (d.yearly || []).slice(-1)[0];
                card.insertAdjacentHTML('beforeend',
                    '<div class="bs-top"><span class="bs-title">' + sym + '</span><span class="bs-name">' + d.name + ' · Balance sheet &amp; financials</span><span class="bs-asof">Latest: ' + (lastQ ? lastQ.p : '') + ' · figures in USD</span></div>' +
                    '<div class="bs-scroll">' +
                    '<div class="bs-bar"></div>' +
                    '<div class="bs-kpis"></div>' +
                    '<div class="bs-main"><div class="bs-panel"><div class="bs-chips"></div><div class="bs-ovr"></div><div class="bs-chart"></div></div>' +
                    '<div class="bs-panel"><div class="bs-detail"></div></div></div>' +
                    '<div class="bs-panel" style="margin-bottom:14px"><div class="bs-h">Analysis <span style="text-transform:none;letter-spacing:0;font-weight:400;color:#8f8f8f">– calculated from the reported figures, not investment advice</span></div><div class="bs-ins"></div></div>' +
                    '<div class="bs-panel"><button type="button" class="bs-copy">Copy table</button><div class="bs-h">Data table <span style="text-transform:none;letter-spacing:0;font-weight:400;color:#8f8f8f">– click a column to select the period</span></div><div class="bs-tblwrap"></div></div>' +
                    '<div class="bs-src">' + (d.source || '') + '</div></div>');
                Object.assign(BS, { sym, d, card, mode: 'quarterly', range: 8, metric: 'rev', overlay: 'yoy', sel: null });
                if (!(d.quarterly || []).length) BS.mode = 'yearly';
                if ((d.quarterly || []).filter((r) => r.rev != null).length < 6) BS.metric = 'ni';
                const ins = card.querySelector('.bs-ins');
                ins.innerHTML = bsInsights().map((i) => '<div><b>' + i[0] + '</b>' + i[1] + '</div>').join('');
                bsDraw();
                const tip = () => card.querySelector('#bs-tip');
                card.addEventListener('click', (e) => {
                    const t = e.target;
                    const seg = t.closest('.bs-seg button');
                    if (seg) { e.stopPropagation(); const id = seg.parentNode.dataset.seg, v = seg.dataset.v; if (id === 'mode') BS.mode = v; else BS.range = v === 'all' ? 'all' : +v; bsDraw(); return; }
                    const chip = t.closest('.bs-chip[data-m], .bs-kpi');
                    if (chip) { BS.metric = chip.dataset.m; bsDraw(); return; }
                    const ov = t.closest('.bs-chip[data-o]');
                    if (ov) { BS.overlay = ov.dataset.o; bsDraw(); return; }
                    const slot = t.closest('.bs-slot');
                    if (slot) { bsSelect(BS.vis[+slot.dataset.i].p); return; }
                    const col = t.closest('[data-p]');
                    if (col) { bsSelect(col.dataset.p); return; }
                    if (t.closest('.bs-copy')) {
                        const txt = bsCsv(), btn = t.closest('.bs-copy');
                        const done = () => { btn.textContent = 'Copied ✓'; setTimeout(() => { btn.textContent = 'Copy table'; }, 1600); };
                        try { navigator.clipboard.writeText(txt).then(done, done); } catch (er) { done(); }
                    }
                });
                card.addEventListener('mousemove', (e) => {
                    const slot = e.target.closest && e.target.closest('.bs-slot'), tp = tip();
                    if (!tp) return;
                    if (!slot) { tp.style.display = 'none'; return; }
                    const r = BS.vis[+slot.dataset.i], box = tp.parentNode.getBoundingClientRect(), k = box.width / tp.parentNode.offsetWidth || 1;
                    tp.innerHTML = bsTipHtml(r);
                    tp.style.display = 'block';
                    let lx = (e.clientX - box.left) / k + 16;
                    if (lx + tp.offsetWidth > tp.parentNode.offsetWidth - 4) lx = (e.clientX - box.left) / k - tp.offsetWidth - 16;
                    tp.style.left = Math.max(0, lx) + 'px';
                    tp.style.top = Math.max(0, (e.clientY - box.top) / k - 20) + 'px';
                });
                card.addEventListener('mouseleave', () => { const tp = tip(); if (tp) tp.style.display = 'none'; });
            }
            document.querySelector('.main-container').appendChild(card);
            finCard = card;
            returnTo = panel || null;
            openFocus(card, true);
        }
        // Pfeiltasten: vorherige / nächste Periode im Balance-sheet-Overlay
        document.addEventListener('keydown', (e) => {
            if (!finCard || !finCard.classList.contains('bs-card') || !finCard.classList.contains('focused') || BS.card !== finCard) return;
            if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
            const i = BS.vis.findIndex((r) => r.p === BS.sel), j = Math.max(0, Math.min(BS.vis.length - 1, i + (e.key === 'ArrowRight' ? 1 : -1)));
            e.preventDefault();
            bsSelect(BS.vis[j].p);
        });

        function openFinancials(symbol, panel) {
            if (finCard) { finCard.remove(); finCard = null; }
            const card = document.createElement('div');
            card.className = 'widget popup-card';
            card.setAttribute('data-popup', '');
            card.style.height = '714px';        // 1.7x so hoch wie die normalen Widgets (420px)
            card.dataset.focusH = '714';
            const title = document.createElement('div');
            title.className = 'widget-title';
            title.textContent = symbol.split(':')[1] + ' Financials';
            card.appendChild(title);
            const x = document.createElement('button');
            x.type = 'button';
            x.className = 'zoom-btn';
            x.title = 'Close';
            x.setAttribute('aria-label', 'Close');
            x.innerHTML = ICONS;
            x.addEventListener('click', (e) => { e.stopPropagation(); closeFocus(); });
            card.prepend(x);
            const sc = document.createElement('script');
            sc.src = 'https://s3.tradingview.com/external-embedding/embed-widget-financials.js';
            sc.async = true;
            sc.text = JSON.stringify({ symbol: symbol, colorTheme: 'dark', displayMode: 'regular', isTransparent: false, locale: 'en', width: '100%', height: 578 });
            card.appendChild(sc);
            document.querySelector('.main-container').appendChild(card);
            finCard = card;
            returnTo = panel || null;
            openFocus(card, true);

        function setLabel(el, open) {
            const btn = el.querySelector(':scope > .zoom-btn');
            if (!btn) return;
            btn.title = open ? 'Close' : 'Enlarge';
            btn.setAttribute('aria-label', btn.title);
        }

        document.querySelectorAll('[data-zoomable]').forEach((el) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'zoom-btn';
            btn.title = 'Enlarge';
            btn.setAttribute('aria-label', 'Enlarge');
            btn.innerHTML = ICONS;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (el.classList.contains('focused')) closeFocus();
                else openFocus(el);
            });
            el.prepend(btn);
        });

        // Knopf "BTC Seasonal" bei General öffnet das Popup
        const btcBtn = document.getElementById('btn-btc-seasonal');
        const btcCard = document.getElementById('btc-card');
        if (btcBtn && btcCard) btcBtn.addEventListener('click', () => openFocus(btcCard));

        // Glühbirne im Stocks-Widget öffnet CELH / SOFI Details
        const stocksBtn = document.getElementById('btn-stocks-detail');
        const stocksPanel = document.getElementById('stocks-panel');
        if (stocksBtn && stocksPanel) stocksBtn.addEventListener('click', (e) => { e.stopPropagation(); openFocus(stocksPanel); });

        // Mappe im Stocks-Widget öffnet die Details der 4 Aktien (PATH, AMZN, HNST, NAUT)
        const folderBtn = document.getElementById('btn-stocks-folder');
        const folderPanel = document.getElementById('folder-panel');
        if (folderBtn && folderPanel) folderBtn.addEventListener('click', (e) => { e.stopPropagation(); openFocus(folderPanel); });

        // Knopf "Balance sheet" in den Panels
        document.querySelectorAll('[data-bs]').forEach((b) => {
            b.addEventListener('click', (e) => {
                e.stopPropagation();
                openBalance(b.dataset.bs, b.closest('.stocks-panel'));
            });
        });

        // Lupe auf den Financials in den Panels (Glühbirne / Mappe)
        document.querySelectorAll('.fin-zoom').forEach((b) => {
            b.addEventListener('click', (e) => {
                e.stopPropagation();
                const box = b.closest('.fin-box');
                openFinancials(box.dataset.symbol, b.closest('.stocks-panel'));
            });
        });

        backdrop.addEventListener('click', () => closeFocus());                 // Klick neben das Widget schliesst auch
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFocus(); });
    })();
</script>

<!-- JavaScript für den großen Hintergrund-Globus -->
<script>
    const canvas = document.getElementById('bg-globe');
    const ctx = canvas.getContext('2d');

    canvas.width = 1020;   // 850 × 1.2
    canvas.height = 1020;

    const globeRadius = 456; // 380 × 1.2
    const lats = 14;
    const lons = 28;
    let angle = 0;

    function drawGlobe() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const centerX = canvas.width * 0.5;
        const centerY = canvas.height * 0.5;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 2;

        angle += 0.002;

        // Breitengrade
        for (let i = 1; i < lats; i++) {
            let lat = Math.PI * (-0.5 + i / lats);
            let r = globeRadius * Math.cos(lat);
            let y = centerY + globeRadius * Math.sin(lat);

            ctx.beginPath();
            let points = 50;
            for (let j = 0; j <= points; j++) {
                let lon = (j / points) * Math.PI * 2 + angle;
                let x = centerX + r * Math.cos(lon);
                if (j === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        // Längengrade
        for (let i = 0; i < lons; i++) {
            let lonOffset = (i / lons) * Math.PI * 2 + angle;
            ctx.beginPath();
            let points = 50;
            for (let j = 0; j <= points; j++) {
                let lat = Math.PI * (-0.5 + j / points);
                let x = centerX + globeRadius * Math.cos(lat) * Math.cos(lonOffset);
                let z = globeRadius * Math.sin(lat);
                let y = centerY + z;
                
                if (j === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        requestAnimationFrame(drawGlobe);
    }

    drawGlobe();
</script>

</body>
