<!-- JavaScript für den großen Hintergrund-Globus -->
<script>
    const canvas = document.getElementById('bg-globe');
    const ctx = canvas.getContext('2d');

    canvas.width = 850;
    canvas.height = 850;

    const globeRadius = 380; // Schön groß skaliert
    const lats = 14;
    const lons = 28;
    let angle = 0;

    function drawGlobe() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const centerX = canvas.width * 0.5;
        const centerY = canvas.height * 0.5;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 2;

        angle += 0.002;

        // Breitengrade
        for (let i = 1; i < lats; i++) {
            let lat = Math.PI * (-0.5 + i / lats);
            let r = globeRadius * Math.cos(lat);
            let y = centerY + globeRadius * Math.sin(lat);

            ctx.beginPath();
            let points = 50;
            for (let j = 0; j <= points; j++) {
                let lon = (j / points) * Math.PI * 2 + angle;
                let x = centerX + r * Math.cos(lon);
                if (j === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        // Längengrade
        for (let i = 0; i < lons; i++) {
            let lonOffset = (i / lons) * Math.PI * 2 + angle;
            ctx.beginPath();
            let points = 50;
            for (let j = 0; j <= points; j++) {
                let lat = Math.PI * (-0.5 + j / points);
                let x = centerX + globeRadius * Math.cos(lat) * Math.cos(lonOffset);
                let z = globeRadius * Math.sin(lat);
                let y = centerY + z;
                
                if (j === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        requestAnimationFrame(drawGlobe);
    }

    drawGlobe();
</script>
