        /* Globus: zentriert hinter dem Daily-News-Widget, 1.2x so gross wie vorher (850px -> 1020px) */
        #bg-globe {

            top: 50%;
            left: 50%;

            height: 1020px;
            z-index: -1;
            opacity: 0.55;

        /* ---------- Scrollbare Widgets ---------- */
        .scrollable {

            overflow-x: hidden !important;
            scrollbar-width: thin;

        /* ---------- BTC-Seasonal-Popup: unsichtbar bereit, wird per Knopf im Fokus-Modus geöffnet ---------- */
        .popup-card:not(.focused) {
            position: fixed;
            top: 0;
            left: -10000px;
            visibility: hidden;
            pointer-events: none;
        }
        .popup-chart { height: calc(100% - 46px); width: 100%; }
        .popup-chart tv-seasonal-chart { display: block; width: 100%; height: 100%; }

        /* ---------- Stocks-Widget: Titel + Glühbirne bleiben stehen, nur die Ticker scrollen ---------- */
        .stocks-widget { display: flex; flex-direction: column; }
        .stocks-widget .scroll-area { flex: 1; min-height: 0; }

        /* ---------- Stocks-Detail (Glühbirne): 4 hohe Widgets (je 1 breit), werden gross eingeblendet ---------- */
        .stocks-panel {
            display: grid;
            grid-template-columns: repeat(4, 456px);
            grid-template-rows: 1fr;
            gap: 38px;
            width: 1938px;     /* 4 x 456 + 3 x 38 */
            height: 1490px;

        .stock-col { background: #3B3A3A; border-radius: 22px; padding: 24px 22px; overflow: hidden; display: flex; flex-direction: column; }
        .stock-title { font-size: 32px; font-weight: 700; text-align: left; margin-bottom: 18px; }
        .stock-col .sym-box { width: 100%; margin-bottom: 9px; }
        /* Technical Analysis: volle Spaltenbreite (wie der News-Knopf), 464px hoch */

        .stock-col .fin-box { width: 100%; margin-bottom: 9px; position: relative; }
        .fin-zoom { top: 6px; right: 6px; }
        .stock-col .fin-box > * { max-width: 100%; }


        /* ---------- Balance sheet (Popup mit Diagrammen) ---------- */

        .bs-head { text-align: center; font-size: 28px; font-weight: 600; }
        .bs-sub { text-align: center; font-size: 14px; color: #9a9a9a; margin-top: 2px; }
        .bs-tabs { display: flex; justify-content: center; gap: 6px; margin: 14px 0; }
        .bs-tab { height: 36px; padding: 0 24px; border: none; border-radius: 10px; background: rgba(255, 255, 255, 0.12); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
        .bs-tab:hover { background: rgba(255, 255, 255, 0.24); }
        .bs-tab.on { background: #fff; color: #000; }
        .bs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .bs-tile { background: #1A1A1A; border-radius: 14px; padding: 12px 14px 6px; }
        .bs-tile h4 { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #d8d8d8; margin-bottom: 4px; }
        .bs-tile h4 span { color: #8f8f8f; font-weight: 400; }
        .bs-tile svg { width: 100%; height: auto; display: block; }
        .bs-legend { display: inline-flex; gap: 10px; }

        /* ---------- Fokus-Modus: Lupe oben rechts, Klick = Widget 2x gross in der Mitte, Kreuz = zurück ---------- */

        #focus-backdrop {

            inset: 0;
            z-index: 90;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;

        #focus-backdrop.show { opacity: 1; pointer-events: auto; }

        .focused {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            margin: 0 !important;
            z-index: 100 !important;
            transform: translate(-50%, -50%) scale(var(--focus-scale, 2)) !important;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
        }

        /* ---------- Intro-Animation (startet erst nach dem Login) ---------- */
        @keyframes fadeInAll {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        /* 0-1s sichtbar, dann in 0.5s ausblenden (1.5s total, 0.5/1.5 = 33%) */
        @keyframes introTitle {
            0%, 66.66% { opacity: 1; }
            100%       { opacity: 0; }
        }

        .header-container,
        .widget,
        .widget-transparent,
        .widget-wrapper {
            opacity: 0;

        body.unlocked .header-container,
        body.unlocked .widget,
        body.unlocked .widget-transparent,

            animation: fadeInAll 0.5s ease-out 1s forwards; /* Dauer 0.5s, Start nach 1s */

        body.unlocked .widget.popup-card { animation: none; opacity: 1; }

        body.unlocked #intro-title {
            animation: introTitle 1.5s linear forwards;
        }

        /* ---------- Login-Bildschirm ---------- */
        #login-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(13, 13, 13, 0.55);

            transition: opacity 0.4s ease;

        .login-box {
            zoom: 1.82;
            background: #3B3A3A;
            border-radius: 18px;
            padding: 28px 28px 24px;
            width: 300px;
            text-align: center;

        .login-box input {
            width: 100%;
            height: 42px;
            margin-bottom: 10px;
            padding: 0 12px;
            border-radius: 9px;
            border: 1px solid #555;
            background: #1A1A1A;
            color: white;
            font-size: 16px;   /* mind. 16px, sonst zoomt iOS beim Tippen rein */
            outline: none;
        }
        .login-box input:focus { border-color: #fff; }
        .login-box button {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 9px;
            background: #FFFFFF;
            color: #000000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .login-box button:hover { background: #e0e0e0; }
        #login-error { height: 18px; margin-top: 10px; font-size: 13px; color: #ff6b6b; }
        .shake { animation: shake 0.35s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

<!-- Login: echtes Formular mit username + current-password, damit Apple (Safari / iCloud-Schlüsselbund) Autofill anbietet.
     method="get" + action + onsubmit sorgen dafür, dass das Formular NIE per POST an den Server geschickt wird (Fehler 405). -->
<div id="login-overlay">
    <form id="login-form" class="login-box" method="get" action="javascript:void(0)" onsubmit="return false;" autocomplete="on">
        <h1>Stock Overview</h1>
        <input type="text" id="username" autocomplete="username" placeholder="Username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <input type="password" id="password" autocomplete="current-password" placeholder="Password" required>
        <button type="submit">Unlock</button>
        <div id="login-error"></div>
    </form>
</div>

<!-- Login-Logik (steht direkt hinter dem Formular, damit der Login sofort aktiv ist, auch wenn der Rest der Seite noch lädt) -->
<script>
    // SHA-256-Hash deines Passworts (aktuell: "DavidSt").
    // Eigenen Hash erzeugen: in der Browser-Konsole ausführen (MEIN_PASSWORT ersetzen):
    // crypto.subtle.digest('SHA-256', new TextEncoder().encode('MEIN_PASSWORT')).then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('')))
    const PASSWORD_HASH = '2f207ea71ea0b7a9ee3c104b465bc05fa1b895965cf86786e5d17e64918e5956';

    async function sha256(text) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const overlay = document.getElementById('login-overlay');

    function unlock() {
        document.body.classList.add('unlocked');   // startet Intro-Animation
        overlay.classList.add('hide');
        setTimeout(() => overlay.remove(), 450);   // Formular entfernen -> Safari bietet "Passwort sichern" an
    }

    async function attemptLogin() {
        errorBox.textContent = '';

        if (!window.crypto || !window.crypto.subtle) {
            errorBox.textContent = 'Please open this page via https.';
            return;
        }

        const pw = document.getElementById('password').value;
        if ((await sha256(pw)) === PASSWORD_HASH) {
            unlock();
        } else {
            errorBox.textContent = 'Wrong password';
            form.classList.remove('shake');
            void form.offsetWidth;                 // Animation neu starten
            form.classList.add('shake');
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    }

    form.addEventListener('submit', (e) => { e.preventDefault(); attemptLogin(); });

    // Passwort-Manager / AutoFill (z.B. Apple Passwörter, 1Password) rufen teils form.submit() direkt auf.
    // Das löst kein "submit"-Event aus -> hier abfangen, damit die Seite nicht neu geladen wird.
    form.submit = () => attemptLogin();
</script>

<!-- Fokus-Modus (Lupe / Kreuz) -->
<script>
    (function () {
        const PAGE_ZOOM = 0.55;   // gleicher Wert wie body { zoom: 0.55 }
        const MAX_SCALE = 2;      // doppelt so gross
        const backdrop = document.getElementById('focus-backdrop');
        let current = null;
        let spacer = null;

        const ICONS =
            '<svg class="ico-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>' +
            '<svg class="ico-close" viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>';

        function openFocus(el, keepReturn) {
            if (current) closeFocus(false);

            // Grösse des Widgets (CSS-Pixel) -> passt den Zoom-Faktor an kleine Bildschirme an
            const w = parseFloat(el.dataset.focusW) || (el.classList.contains('w-wide') ? 950 : 456);
            const h = parseFloat(el.dataset.focusH) || 420;
            const scale = Math.min(
                MAX_SCALE,
                (window.innerWidth  * 0.94) / (w * PAGE_ZOOM),
                (window.innerHeight * 0.94) / (h * PAGE_ZOOM)
            );

            // Platzhalter, damit das Layout an seinem Platz bleibt (nicht nötig für Popups wie BTC Seasonal)
            if (!el.hasAttribute('data-popup')) {
                spacer = document.createElement('div');
                spacer.style.width = w + 'px';
                spacer.style.height = h + 'px';
                spacer.style.gridColumn = el.style.gridColumn;
                el.parentNode.insertBefore(spacer, el);
            }

            el.style.setProperty('--focus-scale', scale);
            el.classList.add('focused');
            backdrop.classList.add('show');
            current = el;
            setLabel(el, true);
        }

        let finCard = null;     // Financials-Popup (wird beim Klick auf die Lupe erzeugt)
        let returnTo = null;    // Panel, das nach dem Schliessen des Popups wieder aufgeht

        function closeFocus(reopen = true) {
            if (!current) return;
            const closing = current;
            current.classList.remove('focused');
            if (spacer) { spacer.remove(); spacer = null; }
            backdrop.classList.remove('show');
            setLabel(current, false);
            current = null;
            if (closing === finCard) {
                finCard.remove();
                finCard = null;
                const back = returnTo;
                returnTo = null;
                if (back && reopen) openFocus(back);
            }
        }


        // ---------- Balance sheet: Diagramme + Tabelle (Daten aus BALANCE_DATA) ----------
        const BS_W = 326, BS_H = 186;

        function bsRows(d, mode) {
            const lag = mode === 'yearly' ? 1 : 4;
            return (d[mode] || []).map((r, i, a) => {
                const o = Object.assign({}, r);
                if (o.grossMargin == null && o.grossProfit != null && o.revenue) o.grossMargin = o.grossProfit / o.revenue * 100;
                if (o.yoy == null && i >= lag && a[i - lag].revenue && o.revenue) o.yoy = (o.revenue / a[i - lag].revenue - 1) * 100;
                return o;
            }).slice(-8);
        }
        function bsMoney(v, div, dec) {
            if (v == null) return '–';
            return (v / div).toLocaleString('de-CH', { minimumFractionDigits: dec, maximumFractionDigits: dec });
        }
        function bsPct(v, sign) {
            if (v == null) return '–';
            return (sign && v > 0 ? '+' : '') + v.toFixed(1) + '%';
        }
        function bsBars(rows, series, fmt, labels) {
            const vals = [];
            rows.forEach((r) => series.forEach((s) => { const v = s.get(r); if (v != null) vals.push(v); }));
            if (!vals.length) return null;
            const top = 20, bot = 24, left = 6, right = 6;
            let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
            if (hi === lo) hi = lo + 1;
            const y = (v) => top + (hi - v) / (hi - lo) * (BS_H - top - bot);
            const n = rows.length, slot = (BS_W - left - right) / n;
            const gw = Math.min(slot * 0.72, 40 * series.length), bw = gw / series.length;
            let g = '<line x1="' + left + '" x2="' + (BS_W - right) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#444"/>';
            rows.forEach((r, i) => {
                const cx = left + slot * i + slot / 2;
                series.forEach((s, k) => {
                    const v = s.get(r);
                    if (v == null) return;
                    const x = cx - gw / 2 + bw * k, y0 = y(0), yy = y(v);
                    const h = Math.max(1, Math.abs(yy - y0)), yTop = Math.min(yy, y0);
                    g += '<rect x="' + x + '" y="' + yTop + '" width="' + (bw - 1.5) + '" height="' + h + '" rx="2" fill="' + (v < 0 ? '#ff6b6b' : s.color) + '"/>';
                    if (labels) g += '<text x="' + (x + (bw - 1.5) / 2) + '" y="' + (v >= 0 ? yTop - 4 : yTop + h + 11) + '" text-anchor="middle" font-size="' + (n > 6 ? 9 : 10.5) + '" fill="#d0d0d0">' + fmt(v) + '</text>';
                });
                g += '<text x="' + cx + '" y="' + (BS_H - 7) + '" text-anchor="middle" font-size="10.5" fill="#8f8f8f">' + r.p + '</text>';
            });
            return '<svg viewBox="0 0 ' + BS_W + ' ' + BS_H + '">' + g + '</svg>';
        }
        function bsLine(rows, get, fmt) {
            const vals = rows.map(get).filter((v) => v != null);
            if (!vals.length) return null;
            const top = 24, bot = 24, left = 14, right = 14;
            let lo = Math.min(...vals) - 3, hi = Math.max(...vals) + 3;
            if (hi === lo) hi = lo + 1;
            const n = rows.length, slot = (BS_W - left - right) / n;
            const y = (v) => top + (hi - v) / (hi - lo) * (BS_H - top - bot);
            let path = '', dots = '', g = '', prevNull = true;
            rows.forEach((r, i) => {
                const cx = left + slot * i + slot / 2, v = get(r);
                if (v != null) {
                    path += (prevNull ? 'M' : 'L') + cx + ' ' + y(v) + ' ';
                    dots += '<circle cx="' + cx + '" cy="' + y(v) + '" r="3.5" fill="#fff"/><text x="' + cx + '" y="' + (y(v) - 8) + '" text-anchor="middle" font-size="' + (n > 6 ? 9 : 10.5) + '" fill="#d0d0d0">' + fmt(v) + '</text>';
                }
                prevNull = v == null;
                g += '<text x="' + cx + '" y="' + (BS_H - 7) + '" text-anchor="middle" font-size="10.5" fill="#8f8f8f">' + r.p + '</text>';
            });
            return '<svg viewBox="0 0 ' + BS_W + ' ' + BS_H + '"><path d="' + path + '" fill="none" stroke="#9a9a9a" stroke-width="2"/>' + dots + g + '</svg>';
        }

        function bsRender(d, mode, body) {
            const rows = bsRows(d, mode);
            const div = d.unitDiv || 1;
            // gleiche Nachkommastellen pro Kennzahl (richtet sich nach dem grössten Wert)
            const money = (keys) => {
                let m = 0;
                rows.forEach((r) => keys.forEach((k) => { if (r[k] != null) m = Math.max(m, Math.abs(r[k]) / div); }));
                const dec = m >= 100 ? 0 : (m >= 10 ? 1 : (div > 1 ? 2 : 1));
                return (v) => bsMoney(v, div, dec);
            };
            const has = (key) => rows.some((r) => r[key] != null);
            if (!rows.length) {
                body.innerHTML = '<div class="bs-empty">No ' + (mode === 'yearly' ? 'yearly' : 'quarterly') + ' figures entered yet.</div>';
                return;
            }
            const tiles = [
                ['Revenue', d.unit, bsBars(rows, [{ get: (r) => r.revenue, color: '#f2f2f2' }], money(['revenue']), true)],
                ['Revenue growth (YoY)', '%', bsBars(rows, [{ get: (r) => r.yoy, color: '#f2f2f2' }], (v) => bsPct(v, true), true)],
                ['Net income', d.unit, bsBars(rows, [{ get: (r) => r.netIncome, color: '#f2f2f2' }], money(['netIncome']), true)],
                ['Gross margin', '%', bsLine(rows, (r) => r.grossMargin, (v) => v.toFixed(1))],
                ['Cash vs. debt', '<span class="bs-legend"><span><i style="background:#f2f2f2"></i>Cash</span><span><i style="background:#7a7a7a"></i>Debt</span></span>',
                    bsBars(rows, [{ get: (r) => r.cash, color: '#f2f2f2' }, { get: (r) => r.debt, color: '#7a7a7a' }], money(['cash', 'debt']), rows.length <= 4)],
                ['Equity', d.unit, bsBars(rows, [{ get: (r) => r.equity, color: '#f2f2f2' }], money(['equity']), true)]
            ].filter((t) => t[2]);

            const metrics = [
                ['Revenue', 'revenue', money(['revenue'])], ['Growth YoY', 'yoy', (v) => bsPct(v, true)], ['Gross margin', 'grossMargin', (v) => bsPct(v, false)],
                ['Net income', 'netIncome', money(['netIncome'])], ['Cash', 'cash', money(['cash', 'debt'])], ['Debt', 'debt', money(['cash', 'debt'])], ['Equity', 'equity', money(['equity'])]
            ].filter((m) => has(m[1]));

            let html = '<div class="bs-grid">' + tiles.map((t) => '<div class="bs-tile"><h4>' + t[0] + '<span>' + t[1] + '</span></h4>' + t[2] + '</div>').join('') + '</div>';
            html += '<table class="bs-table"><thead><tr><th>' + d.unit + '</th>' + rows.map((r) => '<th>' + r.p + '</th>').join('') + '</tr></thead><tbody>';
            metrics.forEach((m) => { html += '<tr><td>' + m[0] + '</td>' + rows.map((r) => '<td>' + m[2](r[m[1]]) + '</td>').join('') + '</tr>'; });
            html += '</tbody></table>';
            body.innerHTML = html;
        }

        function openBalance(sym, panel) {
            const d = BALANCE_DATA[sym];
            if (finCard) { finCard.remove(); finCard = null; }
            const card = document.createElement('div');
            card.className = 'widget popup-card bs-card';
            card.setAttribute('data-popup', '');
            card.dataset.focusW = '1060';
            card.dataset.focusH = '880';
            const x = document.createElement('button');
            x.type = 'button';
            x.className = 'zoom-btn';
            x.title = 'Close';
            x.setAttribute('aria-label', 'Close');
            x.innerHTML = ICONS;
            x.addEventListener('click', (e) => { e.stopPropagation(); closeFocus(); });
            card.appendChild(x);
            card.insertAdjacentHTML('beforeend', '<div class="bs-head">' + sym + ' Balance sheet</div><div class="bs-sub">' + (d ? d.name : sym) + '</div>');
            if (!d) {
                card.insertAdjacentHTML('beforeend', '<div class="bs-empty">No figures entered yet for ' + sym + '.</div>');
            } else {
                let mode = (d.quarterly && d.quarterly.length) ? 'quarterly' : 'yearly';
                const tabs = document.createElement('div');
                tabs.className = 'bs-tabs';
                const body = document.createElement('div');
                const mk = (key, label) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'bs-tab';
                    b.textContent = label;
                    b.addEventListener('click', (e) => { e.stopPropagation(); mode = key; draw(); });
                    tabs.appendChild(b);
                    return b;
                };
                const bq = mk('quarterly', 'Quarterly'), by = mk('yearly', 'Yearly');
                const draw = () => {
                    bq.classList.toggle('on', mode === 'quarterly');
                    by.classList.toggle('on', mode === 'yearly');
                    bsRender(d, mode, body);
                };
                card.appendChild(tabs);
                card.appendChild(body);
                draw();
                card.insertAdjacentHTML('beforeend', '<div class="bs-src">' + (d.source || '') + '</div>');
            }
            document.querySelector('.main-container').appendChild(card);
            finCard = card;
            returnTo = panel || null;
            openFocus(card, true);
        }

        function openFinancials(symbol, panel) {
            if (finCard) { finCard.remove(); finCard = null; }
            const card = document.createElement('div');
            card.className = 'widget popup-card';
            card.setAttribute('data-popup', '');
            card.style.height = '714px';        // 1.7x so hoch wie die normalen Widgets (420px)
            card.dataset.focusH = '714';
            const title = document.createElement('div');
            title.className = 'widget-title';
            title.textContent = symbol.split(':')[1] + ' Financials';
            card.appendChild(title);
            const x = document.createElement('button');
            x.type = 'button';
            x.className = 'zoom-btn';
            x.title = 'Close';
            x.setAttribute('aria-label', 'Close');
            x.innerHTML = ICONS;
            x.addEventListener('click', (e) => { e.stopPropagation(); closeFocus(); });
            card.prepend(x);
            const sc = document.createElement('script');
            sc.src = 'https://s3.tradingview.com/external-embedding/embed-widget-financials.js';
            sc.async = true;
            sc.text = JSON.stringify({ symbol: symbol, colorTheme: 'dark', displayMode: 'regular', isTransparent: false, locale: 'en', width: '100%', height: 578 });
            card.appendChild(sc);
            document.querySelector('.main-container').appendChild(card);
            finCard = card;
            returnTo = panel || null;
            openFocus(card, true);
        }

        function setLabel(el, open) {
            const btn = el.querySelector(':scope > .zoom-btn');
            if (!btn) return;
            btn.title = open ? 'Close' : 'Enlarge';
            btn.setAttribute('aria-label', btn.title);
        }

        document.querySelectorAll('[data-zoomable]').forEach((el) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'zoom-btn';
            btn.title = 'Enlarge';
            btn.setAttribute('aria-label', 'Enlarge');
            btn.innerHTML = ICONS;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (el.classList.contains('focused')) closeFocus();
                else openFocus(el);
            });
            el.prepend(btn);
        });

        // Knopf "BTC Seasonal" bei General öffnet das Popup
        const btcBtn = document.getElementById('btn-btc-seasonal');
        const btcCard = document.getElementById('btc-card');
        if (btcBtn && btcCard) btcBtn.addEventListener('click', () => openFocus(btcCard));

        // Glühbirne im Stocks-Widget öffnet CELH / SOFI Details
        const stocksBtn = document.getElementById('btn-stocks-detail');
        const stocksPanel = document.getElementById('stocks-panel');
        if (stocksBtn && stocksPanel) stocksBtn.addEventListener('click', (e) => { e.stopPropagation(); openFocus(stocksPanel); });

        // Mappe im Stocks-Widget öffnet die Details der 4 Aktien (PATH, AMZN, HNST, NAUT)
        const folderBtn = document.getElementById('btn-stocks-folder');
        const folderPanel = document.getElementById('folder-panel');
        if (folderBtn && folderPanel) folderBtn.addEventListener('click', (e) => { e.stopPropagation(); openFocus(folderPanel); });

        // Knopf "Balance sheet" in den Panels
        document.querySelectorAll('[data-bs]').forEach((b) => {
            b.addEventListener('click', (e) => {
                e.stopPropagation();
                openBalance(b.dataset.bs, b.closest('.stocks-panel'));
            });
        });

        // Lupe auf den Financials in den Panels (Glühbirne / Mappe)
        document.querySelectorAll('.fin-zoom').forEach((b) => {
            b.addEventListener('click', (e) => {
                e.stopPropagation();
                const box = b.closest('.fin-box');
                openFinancials(box.dataset.symbol, b.closest('.stocks-panel'));
            });
        });

        backdrop.addEventListener('click', () => closeFocus());                 // Klick neben das Widget schliesst auch
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFocus(); });
    })();
</script>

<!-- JavaScript für den großen Hintergrund-Globus -->
<script>
    const canvas = document.getElementById('bg-globe');
    const ctx = canvas.getContext('2d');

    canvas.width = 1020;   // 850 × 1.2
    canvas.height = 1020;

    const globeRadius = 456; // 380 × 1.2
    const lats = 14;
    const lons = 28;
    let angle = 0;

    function drawGlobe() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const centerX = canvas.width * 0.5;
        const centerY = canvas.height * 0.5;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 2;

        angle += 0.002;

        // Breitengrade
        for (let i = 1; i < lats; i++) {
            let lat = Math.PI * (-0.5 + i / lats);
            let r = globeRadius * Math.cos(lat);
            let y = centerY + globeRadius * Math.sin(lat);

            ctx.beginPath();
            let points = 50;
            for (let j = 0; j <= points; j++) {
                let lon = (j / points) * Math.PI * 2 + angle;
                let x = centerX + r * Math.cos(lon);
                if (j === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        // Längengrade
        for (let i = 0; i < lons; i++) {
            let lonOffset = (i / lons) * Math.PI * 2 + angle;
            ctx.beginPath();
            let points = 50;
            for (let j = 0; j <= points; j++) {
                let lat = Math.PI * (-0.5 + j / points);
                let x = centerX + globeRadius * Math.cos(lat) * Math.cos(lonOffset);
                let z = globeRadius * Math.sin(lat);
                let y = centerY + z;
                
                if (j === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        requestAnimationFrame(drawGlobe);
    }

    drawGlobe();
</script>
