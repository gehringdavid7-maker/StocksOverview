<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Overview</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0D0D0D; font-family:Arial, Helvetica, sans-serif; color:white; padding: 40px 20px; zoom: 0.55; transform-origin: top left; }
        
        .header-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; }
        .header { font-size: 50px; font-weight: 600; }
        .clock-container { margin-top: 10px; transform: scale(2); transform-origin: center top; }
        
        .main-container { display: flex; flex-direction: column; align-items: center; gap: 38px; }
        .dashboard { display: grid; grid-template-columns: repeat(5, 456px); gap: 38px; margin-bottom: 38px; }
        
        .widget { background:#3B3A3A; border-radius: 22px; padding: 24px; overflow: hidden; height: 420px; width: 456px; }
        .w-wide { width: 950px; }
        .widget-wrapper { background:#3B3A3A; border-radius: 22px; padding: 24px; overflow: hidden; height: 420px; }
        
        .widget-title { text-align:center; font-size: 24px; font-weight:600; margin-bottom:18px; }
        .ticker-item { background: #1A1A1A; border-radius: 10.5px; margin-bottom: 9px; height: 54px; display: flex; align-items: center; overflow: hidden; }
        
        .white-btn-style { background: #FFFFFF !important; color: #000000 !important; font-weight: bold; height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 10.5px; cursor: pointer; text-decoration: none; margin-bottom: 9px; border: none; width: 100%; font-size: 21px; }
        .white-btn-style:hover { background: #e0e0e0 !important; }
    </style>
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-single-ticker.js"></script>
</head>
<body>

<div class="header-container">
    <div class="header">Stock Overview</div>
    <div class="clock-container">
        <iframe src="https://free.timeanddate.com/clock/iahjfplq/n268/fcfff/tct/pct/ftb/tt0/tw0/tm1/td2/th2/tb4" frameborder="0" width="88" height="34" allowtransparency="true"></iframe>
    </div>
</div>

<div class="main-container">
    <div class="dashboard">
        <div class="widget"><div class="widget-title">Index</div><div class="ticker-item"><tv-single-ticker symbol="SIX:WORLD"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="AMEX:VOO"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="AMEX:COPX"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="NASDAQ:QQQ"></tv-single-ticker></div></div>
        <div class="widget"><div class="widget-title">Stocks</div><div class="ticker-item"><tv-single-ticker symbol="NYSE:PATH"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="NYSE:NUVB"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="NASDAQ:HNST"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="NASDAQ:CELH"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="NASDAQ:NAUT"></tv-single-ticker></div></div>
        <div class="widget"><div class="widget-title">Currencies & Crypto</div><div class="ticker-item"><tv-single-ticker symbol="OANDA:EURUSD"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="FX:USDJPY"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="OANDA:USDCHF"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="OANDA:GBPUSD"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="BITSTAMP:BTCUSD"></tv-single-ticker></div></div>
        <div class="widget"><div class="widget-title">Precious Metals</div><div class="ticker-item"><tv-single-ticker symbol="OANDA:XAUUSD"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="TVC:SILVER"></tv-single-ticker></div><div class="ticker-item"><tv-single-ticker symbol="TVC:GOLDSILVER"></tv-single-ticker></div></div>
        <div class="widget"><div class="widget-title">General</div><button class="white-btn-style" onclick="window.open('https://x.com/i/lists/2071504003737801125', '_blank')">X-Liste (News)</button><button class="white-btn-style" onclick="window.open('https://chatgpt.com/c/6984b214-0610-832b-a7fe-b1f39f180ce6', '_blank')">AI Assistent</button><button class="white-btn-style" onclick="window.open('https://app.parqet.com/p/690a8388380ec9374c3cd3a8', '_blank')">Portfolio</button><div class="white-btn-style" onclick="window.open('https://www.cash.ch/rohstoffe-edelmetalle/silber-1-kg-999-274706/ubs/chf', '_blank')">Silber 1kg (CHF)</div></div>
    </div>

    <div class="dashboard">
        <div class="widget-wrapper w-wide" style="grid-column: span 2;">
            <div class="widget-title">Market Heatmap</div>
            <div class="tradingview-widget-container" style="height:100%; width:100%;">
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px); width:100%;"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>{ "dataSource": "SPX500", "blockSize": "market_cap_basic", "blockColor": "change", "grouping": "sector", "locale": "en", "colorTheme": "dark", "width": "100%", "height": "100%" }</script>
            </div>
        </div>
        <div class="widget-wrapper" style="grid-column: 4;">
            <div class="widget-title">Daily News</div>
            <div class="tradingview-widget-container" style="height:100%; width:100%;">
              <div class="tradingview-widget-container__widget" style="height:100%; width:100%;"></div>
              <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>{ "displayMode": "regular", "feedMode": "all_symbols", "colorTheme": "dark", "isTransparent": true, "locale": "en", "width": "100%", "height": "100%" }</script>
            </div>
        </div>
        <div class="widget" style="grid-column: 5;">
            <div class="widget-title">Stock News</div>
            <button class="white-btn-style" onclick="window.open('https://x.com/search?q=%24path', '_blank')">UiPath</button>
            <button class="white-btn-style" onclick="window.open('https://x.com/search?q=%24hnst', '_blank')">Honest Company</button>
            <button class="white-btn-style" onclick="window.open('https://x.com/search?q=%24nuvb', '_blank')">Nuvation Bio</button>
            <button class="white-btn-style" onclick="window.open('https://x.com/search?q=%24NAUT', '_blank')">Nautilus Biotech</button>
            <button class="white-btn-style" onclick="window.open('https://x.com/search?q=%24CELH', '_blank')">Celsius</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="widget-wrapper w-wide" style="grid-column: span 4;">
            <div class="widget-title">Economic Calendar</div>
            <div class="tradingview-widget-container" style="height:100%; width:100%;">
                <div class="tradingview-widget-container__widget" style="height:100%; width:100%;"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>{ "colorTheme": "dark", "isTransparent": true, "locale": "en", "countryFilter": "us,eu,de,ch,au,cn", "importanceFilter": "0,1", "width": "100%", "height": "100%" }</script>
            </div>
        </div>
        <div class="widget" style="grid-column: 5;">
            <div class="widget-title">Thesen</div>
            <a class="white-btn-style" href="https://docs.google.com/document/d/1FTWQAI1QQKQqkydtbsWNR69pCp7OSIF9Z-sUMaZH3os/edit" target="_blank">UiPath</a>
            <a class="white-btn-style" href="https://docs.google.com/document/d/12VfG6KI030VOc7L-iZLUSKet20cDYAEvMzOnTV5ioxE/edit" target="_blank">Honest Company</a>
            <a class="white-btn-style" href="https://docs.google.com/document/d/1YeuJg2p13AniTs5E0PYjb-zA5sedeXAkr9Z7cyV12nw/edit" target="_blank">Nuvation Bio</a>
            <a class="white-btn-style" href="https://docs.google.com/document/d/1-X8FBsrXvDo7lEXaOoEVkB6CigfCSH3TOzj6QMNB_aE/edit" target="_blank">Nautilus Biotech</a>
            <a class="white-btn-style" href="https://docs.google.com/document/d/1T97PiqgncvsyzGFe1H6IEQSl7AwHTZldI9N3HDHZvMw/edit" target="_blank">Celsius Holding</a>
        </div>
    </div>
    
    <div class="dashboard">
        <div class="widget">
            <div class="widget-title">PATH Financials</div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-financials.js" async>{ "symbol": "NYSE:PATH", "colorTheme": "dark", "width": 400, "height": 340 }</script>
        </div>
        <div class="widget">
            <div class="widget-title">HNST Financials</div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-financials.js" async>{ "symbol": "NASDAQ:HNST", "colorTheme": "dark", "width": 400, "height": 340 }</script>
        </div>
        <div class="widget">
            <div class="widget-title">NUVB Financials</div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-financials.js" async>{ "symbol": "NYSE:NUVB", "colorTheme": "dark", "width": 400, "height": 340 }</script>
        </div>
        <div class="widget">
            <div class="widget-title">NAUT Financials</div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-financials.js" async>{ "symbol": "NASDAQ:NAUT", "colorTheme": "dark", "width": 400, "height": 340 }</script>
        </div>
    </div>
</div>
</body>
</html>
